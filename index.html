<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сканер QR-кодов платёжек</title>
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--ink:#1b1f2a;--mut:#4b5660;--navy:#1f3864;--band:#d9e2ea;--bandink:#16324a;--line:#b9c3cc;--in:#fff2cc;--inink:#0a2a8a;--chg:#c0362c;--ok:#2f7d5b;--art:#0b57d0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--ink:#f0f4f7;--mut:#a9b5bf;--navy:#2b4a85;--band:#26384a;--bandink:#d3e1ee;--line:#3d4b58;--in:#4a3f12;--inink:#b9d0ff;--chg:#ff6b5e;--ok:#5fcf9c;--art:#8ab4f8}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--ink:#f0f4f7;--mut:#a9b5bf;--navy:#2b4a85;--band:#26384a;--bandink:#d3e1ee;--line:#3d4b58;--in:#4a3f12;--inink:#b9d0ff;--chg:#ff6b5e;--ok:#5fcf9c;--art:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 12px 28px}
h1{font-size:21px;margin:6px 0 4px}
.ver{font-size:12px;font-weight:400;color:var(--mut);white-space:nowrap}
.tbl{font-size:14px;color:var(--mut);margin:0 0 6px}
.tbl a{color:var(--art);font-weight:700}
#tblst.ok{color:var(--ok);font-weight:700}
#tblst.err{color:var(--chg);font-weight:700}
h2{background:var(--band);color:var(--bandink);font-size:16px;margin:16px 0 0;padding:10px 12px;border-radius:10px 10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 156px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.nm{font-weight:700;font-size:16px;line-height:1.25}
.nm small{display:block;color:var(--art);font-size:15px;font-weight:700;margin-top:2px}
.in{position:relative}
.in input{width:100%;height:48px;font:inherit;font-size:20px;font-weight:600;padding:2px 44px 2px 10px;border:2px solid var(--line);border-radius:10px;background:var(--in);color:var(--inink);text-align:right}
.in input:focus{outline:none;border-color:var(--navy)}
.cam{position:absolute;right:2px;top:2px;bottom:2px;width:40px;padding:0;border:0;background:transparent;font-size:21px}
#clear{display:block;width:100%;margin-top:22px;min-height:50px;border:2px solid var(--chg);border-radius:10px;background:transparent;color:var(--chg);font:inherit;font-weight:700;font-size:16px}
#ov{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#ov[hidden]{display:none}
#ov video{flex:1;min-height:0;width:100%;object-fit:cover}
#msg{color:#fff;text-align:center;padding:12px}
#stat{color:#9aa7b2;text-align:center;font-size:12px;padding:0 12px 8px}
#zoom{margin:0 16px 30px;width:calc(100% - 32px)}
#close{margin:0 12px 12px;min-height:46px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit}
</style>
</head>
<body>
<main>
<h1>Сканер QR-кодов платёжек <small class="ver">v6 · 20.10</small></h1>
<p class="tbl"><span id="tblst">Таблица: не подключена</span> · <a href="#" id="tblset">настроить</a></p>
<div id="app"></div>
<button id="clear" type="button">Очистить таблицу на новый месяц</button>
</main>

<div id="ov" hidden>
  <video id="vid" playsinline muted></video>
  <div id="msg"></div>
  <div id="stat"></div>
  <input id="zoom" type="range" hidden aria-label="Приближение">
  <button id="close" type="button">Закрыть</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js"></script>
<script>
// Страница только считывает суммы и отправляет их в Google Таблицу. Округление, итоги и контроль оплаты ведутся в таблице.
const BLOCKS=[
 ['Тракторостроителей 8А',[['gy','Тракторостр 8А','ЖКХ'],['gm','Тракторостр 8А','Ситиматик']]],
 ['324-я Стрелковая + Общежитие',[['py','324я Стрелков','ЖКХ'],['pk','324я Стрелков','Капремонт'],['pe','324я Стрелков','Энергосбыт'],['po','Общежитие','ЖКХ']]],
 ['Капремонт (через Альфа Банк)',[['gk','Тракторостр 8А','Капремонт'],['pc','Общежитие','Капремонт']]]
];
const R={};
const el=(t,cls,h)=>{const e=document.createElement(t);if(cls)e.className=cls;if(h!=null)e.innerHTML=h;return e};
const app=document.getElementById('app');
BLOCKS.forEach(([h,rows])=>{
  app.append(el('h2',0,h));
  const card=el('div','card');
  rows.forEach(([k,obj,art])=>{
    const row=el('div','row');
    row.innerHTML=`<div class="nm">${obj}<small>${art}</small></div>
      <div class="in"><input type="text" inputmode="decimal" placeholder="0,00" aria-label="${obj} ${art}"><button class="cam" type="button" aria-label="Считать QR камерой">📷</button></div>`;
    const inp=row.querySelector('input');
    inp.onchange=()=>{ // ручной ввод тоже уходит в таблицу; пустое поле очищает ячейку
      if(inp.value.trim()===''){send(k,null);return}
      const x=parseFloat(inp.value.replace(/\s/g,'').replace(',','.'));
      if(!isNaN(x))send(k,Math.round(x*100));
    };
    row.querySelector('.cam').onclick=()=>scan(k);
    R[k]={inp};
    card.append(row);
  });
  app.append(card);
});

/* ---- Передача сумм в Google Таблицу через скрипт Apps Script (адрес и секретное слово хранятся только в браузере телефона) ---- */
let SU='', ST='';
try{SU=localStorage.getItem('gsu')||'';ST=localStorage.getItem('gst')||''}catch(e){}
const tblEl=document.getElementById('tblst');
function tbl(text,cls){tblEl.textContent='Таблица: '+text;tblEl.className=cls||''}
function tblInit(){SU&&ST?tbl('подключена'):tbl('не подключена')}
tblInit();
async function post(body){ // сначала обычный запрос (читаем ответ), при ошибке CORS — без ответа
  const o={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)};
  try{const r=await fetch(SU,o);return await r.json()}
  catch(e){try{await fetch(SU,{...o,mode:'no-cors'});return {ok:true,blind:true}}catch(e2){return {ok:false,error:'нет связи'}}}
}
async function send(k,kop){
  if(!SU||!ST)return;
  tbl('отправляю…');
  const j=await post({token:ST,key:k,value:kop==null?null:kop/100});
  j.ok?tbl(j.blind?'отправлено (без подтверждения)':'записано в '+j.cell,'ok'):tbl('ошибка: '+j.error,'err');
}
document.getElementById('tblset').onclick=async e=>{
  e.preventDefault();
  const u=prompt('Адрес веб-приложения Google Apps Script (заканчивается на /exec). Пустое поле отключит передачу:',SU);if(u===null)return;
  let t=ST;if(u.trim()){t=prompt('Секретное слово:',ST);if(t===null)return}
  SU=u.trim();ST=(t||'').trim();
  try{localStorage.setItem('gsu',SU);localStorage.setItem('gst',ST)}catch(e){}
  if(!SU||!ST){tblInit();return}
  tbl('проверяю…');const j=await post({token:ST,ping:true});
  j.ok?tbl(j.blind?'адрес сохранён (ответ не проверен)':'подключена','ok'):tbl('ошибка: '+j.error,'err');
};

/* ---- Живая камера: встроенный BarcodeDetector, запасной jsQR ---- */
const ov=document.getElementById('ov'), vid=document.getElementById('vid'), msg=document.getElementById('msg'), stat=document.getElementById('stat'), zoomEl=document.getElementById('zoom');
let statBase='', seenInfo='', zoomPref=1.5; // начальное приближение 1,5×; дальше запоминается выбранное ползунком
const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
let det, stream, target, timer, t0=0, tick=0;
// Платёжный QR (ГОСТ Р 56042): ST00011|...|Sum=238373|... — сумма в копейках
function parseSum(t){
  const m=t.match(/(?:^|[|;&?])\s*(?:Sum|Summ|Summa|Amount|Сумма)\s*=\s*([\d.,]+)/i); if(!m)return null;
  const s=m[1]; return /[.,]/.test(s)?Math.round(parseFloat(s.replace(',','.'))*100):parseInt(s,10);
}
function got(text){
  const k=parseSum(text); if(k==null){msg.textContent='В QR нет суммы: '+text.slice(0,100);return false}
  R[target].inp.value=(k/100).toFixed(2).replace('.',','); send(target,k); stop(); return true;
}
function stop(){clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null;ov.hidden=true;zoomEl.hidden=true}
// из найденных кодов берём тот, где есть Sum=; если формат не QR — помечаем его
// zxing-wasm (ядро zxing-cpp): читает плотные QR с экрана и cp1251 надёжнее jsQR; берём сырые байты
async function zread(img){
  if(typeof ZXingWASM==='undefined')return null;
  try{const r=await ZXingWASM.readBarcodes(img,{formats:['QRCode'],maxNumberOfSymbols:1,tryHarder:true});
    if(r.length){const b=r[0].bytes;return b&&b.length?String.fromCharCode.apply(null,Array.from(b)):r[0].text}}catch(e){}
  return null}
// Встроенный сканер код видит, но текст в старой кодировке (cp1251, ST00011) отдаёт пустым или кракозябрами:
// вырезаем область кода и читаем сырые байты через jsQR
function cropRead(src,sw,sh,bb){
  if(typeof jsQR!=='function'||!bb)return null;
  const mx=bb.width*.15,my=bb.height*.15,x=Math.max(0,bb.x-mx),y=Math.max(0,bb.y-my),w=Math.min(sw-x,bb.width+2*mx),h=Math.min(sh-y,bb.height+2*my);
  for(const m of [900,1200,700]){
    const s=m/Math.max(w,h),iw=Math.round(w*s),ih=Math.round(h*s),pd=Math.round(Math.max(iw,ih)*0.08);
    cv.width=iw+2*pd;cv.height=ih+2*pd;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(src,x,y,w,h,pd,pd,iw,ih);
    const d=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
    if(q)return String.fromCharCode.apply(null,q.binaryData)||q.data;
  }
  return null;
}
function pick(r){const b=r.find(x=>/sum\s*=/i.test(x.rawValue))||r[0];return b.format&&b.format!=='qr_code'?'['+b.format+'] '+b.rawValue:b.rawValue}
async function decode(){
  if('BarcodeDetector' in window){try{det=det||new BarcodeDetector();const r=await det.detect(vid);if(r.length){const t=pick(r);seenInfo=' · найдено: '+r.length+(t?'':' (текст пуст)');
      if(t&&/sum\s*=/i.test(t))return t;
      const c=cropRead(vid,vid.videoWidth,vid.videoHeight,(r.find(x=>!/sum\s*=/i.test(x.rawValue||''))||r[0]).boundingBox);
      if(c)return c; if(t)return t}}catch(e){}}
  const w=vid.videoWidth,h=vid.videoHeight; if(!w)return null;
  const V=[[.91,0],[.68,0],[.91,.8],[.68,.8],[.91,1.2],[.68,1.2]][tick++%6]; // на каждом новом кадре — следующий вариант: масштаб × сглаживание (гасит «сетку» монитора)
  for(const m of [V[0]]){ // белое поле вокруг кадра (тихая зона QR)
    const s=m,iw=Math.round(w*s),ih=Math.round(h*s),pd=Math.round(Math.max(iw,ih)*0.08);
    cv.width=iw+2*pd;cv.height=ih+2*pd;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.filter=V[1]?'blur('+V[1]+'px)':'none';cx.drawImage(vid,pd,pd,iw,ih);cx.filter='none';
    const z=await zread(cx.getImageData(0,0,cv.width,cv.height)); if(z)return z;
    if(typeof jsQR==='function'){
      const d=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
      // binaryData: полный текст, в т.ч. для кодировки cp1251 (q.data для неё пустой)
      if(q)return String.fromCharCode.apply(null,q.binaryData)||q.data;
    }
  }
  return null;
}
function loop(){timer=setTimeout(async()=>{
  try{seenInfo='';const t1=performance.now(),t=await decode();stat.textContent=statBase+seenInfo+' · '+Math.round(performance.now()-t1)+' мс/кадр';if(t&&got(t))return}catch(e){}
  if(stream){if(Date.now()-t0>6000&&msg.textContent.indexOf('Наведите')===0)msg.textContent='Не читается? Держите телефон ровно, в 20 см от QR, без бликов; QR должен быть чётким.';loop()}},40)}
async function scan(k){
  target=k; t0=Date.now(); ov.hidden=false; msg.textContent='Запускаю камеру…';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'камера недоступна на этой странице'};
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    vid.srcObject=stream; await vid.play(); msg.textContent='Наведите камеру на QR платёжки';
    const tr=stream.getVideoTracks()[0], cap=tr.getCapabilities?tr.getCapabilities():{}, st=tr.getSettings?tr.getSettings():{};
    statBase=vid.videoWidth+'×'+vid.videoHeight+' · встроенный сканер: '+(('BarcodeDetector' in window)?'да':'нет')+' · zxing: '+((typeof ZXingWASM!=='undefined')?'да':'нет');
    stat.textContent=statBase;
    if(cap.zoom){const z0=Math.min(cap.zoom.max,Math.max(cap.zoom.min,zoomPref));zoomEl.min=cap.zoom.min;zoomEl.max=cap.zoom.max;zoomEl.step=cap.zoom.step||0.1;zoomEl.value=z0;zoomEl.hidden=false;
      tr.applyConstraints({advanced:[{zoom:z0}]}).catch(()=>{});
      zoomEl.oninput=()=>{zoomPref=+zoomEl.value;tr.applyConstraints({advanced:[{zoom:zoomPref}]}).catch(()=>{})}}
    loop();
  }catch(e){msg.textContent='Нет доступа к камере ('+(e.name||'ошибка')+'). Разрешите камеру в браузере.'}
}
document.getElementById('close').onclick=stop;

// Новый месяц: очищаем поля на странице и жёлтые ячейки «Было» в таблице
document.getElementById('clear').onclick=async()=>{
  if(!confirm('Очистить поля на странице'+(SU&&ST?' и все суммы «Было» и отметки «Оплачено» в таблице':'')+'?'))return;
  for(const k in R)R[k].inp.value='';
  if(!SU||!ST){tbl('поля очищены');return}
  tbl('очищаю таблицу…');
  const res=await Promise.all([...Object.keys(R).map(k=>post({token:ST,key:k,value:null})),post({token:ST,clearPaid:true})]);
  const paid=res.pop(), bad=res.filter(j=>!j.ok);
  if(bad.length)tbl('ошибка при очистке: '+bad[0].error,'err');
  else if(!paid.ok)tbl(/неизвестная строка/.test(paid.error||'')?'суммы очищены, но для сброса «Оплачено» нужно обновить скрипт (инструкция, п. 9)':'суммы очищены, ошибка сброса «Оплачено»: '+paid.error,'err');
  else tbl(res.concat(paid).some(j=>j.blind)?'очистка отправлена (без подтверждения)':'очищено: суммы и отметки «Оплачено»','ok');
};
</script>
</body>
</html>
