<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оплата коммунальных платежей</title>
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--ink:#1b1f2a;--mut:#5b6770;--navy:#1f3864;--band:#d9e2ea;--bandink:#16324a;--line:#cdd5dc;--in:#fff2cc;--inink:#0000ff;--chg:#c0362c;--ok:#2f7d5b;--part:#c77700;--paid:#9a9a9a;--art:#0b57d0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--ink:#e8edf1;--mut:#9aa7b2;--navy:#2b4a85;--band:#26384a;--bandink:#d3e1ee;--line:#33414e;--in:#4a3f12;--inink:#8fb4ff;--chg:#ff6b5e;--ok:#5fcf9c;--part:#f0a64a;--paid:#6f7a84;--art:#8ab4f8}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--ink:#e8edf1;--mut:#9aa7b2;--navy:#2b4a85;--band:#26384a;--bandink:#d3e1ee;--line:#33414e;--in:#4a3f12;--inink:#8fb4ff;--chg:#ff6b5e;--ok:#5fcf9c;--part:#f0a64a;--paid:#6f7a84;--art:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:10px 8px}
h1{font-size:17px;margin:4px 0 2px}
.ver{font-size:11px;font-weight:400;color:var(--mut);white-space:nowrap}
.note{color:var(--mut);font-size:12px;margin:0 0 8px}
h2{background:var(--band);color:var(--bandink);font-size:14px;margin:10px 0 0;padding:7px 10px;border-radius:8px 8px 0 0}
.hd{background:var(--navy);color:#fff;font-size:10px;font-weight:700;text-align:center;border-radius:8px 8px 0 0;margin-top:10px}
.hd+h2{margin-top:0;border-radius:0}
.card{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px}
.g,.row{display:grid;grid-template-columns:minmax(0,1fr) 100px 62px 40px;gap:4px;align-items:center;padding:6px 8px}
.hd.g{padding:6px 8px}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.nm{font-weight:600;font-size:13px}
.nm small{color:var(--art);font-weight:700}
.paid .nm small{color:var(--paid)}
.in{position:relative}
.in input{width:100%;height:34px;font:inherit;font-size:15px;padding:2px 30px 2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--in);color:var(--inink);text-align:right}
.cam{position:absolute;right:1px;top:1px;bottom:1px;width:28px;padding:0;border:0;background:transparent;font-size:16px}
.new,.was{text-align:right;white-space:nowrap}
.new{font-weight:700;font-size:14px}
.was{color:var(--mut);font-size:13px}
.new.chg{color:var(--chg)}
.chk{display:flex;justify-content:center}
.chk input{width:22px;height:22px;accent-color:var(--ok)}
.paid .nm,.paid .new,.paid .was{color:var(--paid);text-decoration:line-through}
.paid .new.chg{color:var(--paid)}
.ck{display:grid;grid-template-columns:1.5fr 1.2fr 1fr 1fr 1fr;gap:4px;align-items:center;padding:6px 8px;font-size:12px}
.ck.row{border-top:1px solid var(--line)}
.ck .n{text-align:right;white-space:nowrap}
.st{font-weight:700}.st.ok{color:var(--ok)}.st.part{color:var(--part)}
.cash{margin:16px 0 8px;text-align:center;color:#ff0000;font-weight:700;font-size:16px}
#ov{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#ov[hidden]{display:none}
#ov video{flex:1;min-height:0;width:100%;object-fit:cover}
#msg{color:#fff;text-align:center;padding:12px}
#stat{color:#9aa7b2;text-align:center;font-size:12px;padding:0 12px 8px}
#zoom{margin:0 16px 30px;width:calc(100% - 32px)}
#snap{margin:0 12px 10px;min-height:46px;border:0;border-radius:8px;background:#2f7d5b;color:#fff;font:inherit}
#snap[hidden]{display:none}
#close{margin:0 12px 12px;min-height:46px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit}
</style>
</head>
<body>
<main>
<h1>Оплата коммунальных платежей с округлением <small class="ver">v2 · 19.10</small></h1>
<p class="note">Суммы по квитанциям вводятся в жёлтые ячейки столбца «Было».<br>Округление вверх:<br>1) основной платёж (всё, кроме блока «Капремонт»): разница на ЖКХ Григорьева;<br>2) платёж Порфирьева: разница на капремонт общежития.</p>
<div id="app"></div>
<p class="cash">ВЫБЕРИ КАТЕГОРИИ КЭШБЭК</p>
</main>

<div id="ov" hidden>
  <video id="vid" playsinline muted></video>
  <div id="msg"></div>
  <div id="stat"></div>
  <input id="zoom" type="range" hidden aria-label="Приближение">
  <button id="snap" type="button" hidden>Снимок высокого разрешения</button>
  <button id="close" type="button">Закрыть</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js"></script>
<script>
const BLOCKS=[
 ['Тракторостроителей 8А',[['gy','Тракторостр 8А','ЖКХ'],['gm','Тракторостр 8А','Ситиматик']]],
 ['324-я Стрелковая + Общежитие',[['py','324я Стрелков','ЖКХ'],['pk','324я Стрелков','Капремонт'],['pe','324я Стрелков','Энергосбыт'],['po','Общежитие','ЖКХ']]],
 ['Капремонт (через Альфа Банк)',[['gk','Тракторостр 8А','Капремонт'],['pc','Общежитие','Капремонт']]]
];
const KS=['gy','gm','py','pk','pe','po'], KP=['py','pk','pe','po','pc'], KG=['gy','gm','gk'];
const TOT=[['Основной платёж (ОТП Банк)',KS],['324я Стрелк + Общеж + капр',KP],['Тракторостр 8А + капремонт',KG]];
const v={}, paid={}, R={}, T=[], C={}, LAB={Григорьев:'Тракторостроителей 8А',Порфирьев:'324я Стрелков + Общежитие'};
const c=k=>v[k]||0, sum=(ks,o)=>ks.reduce((a,k)=>a+o(k),0), up=k=>Math.ceil(k/1e4)*1e4;
const f=k=>(k/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const el=(t,cls,h)=>{const e=document.createElement(t);if(cls)e.className=cls;if(h!=null)e.innerHTML=h;return e};
const app=document.getElementById('app');
const head=()=>el('div','hd g','<div>Объект / Статья</div><div>Было (по квитанции)</div><div>Стало (к оплате)</div><div>Оплачено</div>');

app.append(head());
BLOCKS.forEach(([h,rows])=>{
  app.append(el('h2',0,h));
  const card=el('div','card');
  rows.forEach(([k,obj,art])=>{
    const row=el('div','row');
    row.innerHTML=`<div class="nm">${obj} <small>${art}</small></div>
      <div class="in"><input type="text" inputmode="decimal" placeholder="0,00" aria-label="${obj} ${art}"><button class="cam" type="button" aria-label="Считать QR камерой">📷</button></div>
      <div class="new"></div>
      <label class="chk"><input type="checkbox" aria-label="Оплачено"></label>`;
    const inp=row.querySelector('input[type=text]');
    inp.oninput=()=>{const x=parseFloat(inp.value.replace(/\s/g,'').replace(',','.'));v[k]=isNaN(x)?0:Math.round(x*100);upd()};
    row.querySelector('.cam').onclick=()=>scan(k);
    row.querySelector('input[type=checkbox]').onchange=e=>{paid[k]=e.target.checked;upd()};
    R[k]={row,inp,nw:row.querySelector('.new')};
    card.append(row);
  });
  app.append(card);
});

app.append(el('h2',0,'Итоги'));
app.append(head());
const tc=el('div','card');
TOT.forEach(([name])=>{
  const row=el('div','row');
  row.innerHTML=`<div class="nm">${name}</div><div class="was"></div><div class="new"></div>
    <label class="chk"><input type="checkbox" disabled aria-label="Оплачено"></label>`;
  T.push({row,was:row.querySelector('.was'),nw:row.querySelector('.new'),cb:row.querySelector('input')});
  tc.append(row);
});
app.append(tc);

app.append(el('h2',0,'Проверка оплаты'));
app.append(el('div','hd ck','<div>Проверка оплаты</div><div>Статус</div><div>К оплате (итог)</div><div>Отмечено галочками</div><div>Осталось</div>'));
const pc=el('div','card');
['Григорьев','Порфирьев','Всего'].forEach(n=>{
  const row=el('div','ck row',`<div><b>${LAB[n]||n}</b></div><div class="st"></div><div class="n"></div><div class="n"></div><div class="n"></div>`);
  const [,st,a,b,d]=row.children; C[n]={st,s:[a,b,d]};
  pc.append(row);
});
app.append(pc);

function upd(){
  const S=sum(KS,c), P=sum(KP,c), n={};
  [...KP,...KS,'gk'].forEach(k=>n[k]=c(k));
  n.gy+=up(S)-S; n.pc+=up(P)-P;
  for(const k in R){const r=R[k];
    r.nw.textContent=f(n[k]); r.nw.classList.toggle('chg',n[k]!==c(k));
    r.row.classList.toggle('paid',!!paid[k]);}
  const olds=[S,P,sum(KG,c)];
  TOT.forEach(([,ks],i)=>{const t=T[i],all=ks.every(k=>paid[k]),nv=sum(ks,k=>n[k]);
    t.was.textContent=f(olds[i]); t.nw.textContent=f(nv); t.nw.classList.toggle('chg',nv!==olds[i]);
    t.cb.checked=all; t.row.classList.toggle('paid',all);});
  const due={Григорьев:sum(KG,k=>n[k]),Порфирьев:sum(KP,k=>n[k])};
  const got={Григорьев:sum(KG,k=>paid[k]?n[k]:0),Порфирьев:sum(KP,k=>paid[k]?n[k]:0)};
  due['Всего']=due.Григорьев+due.Порфирьев; got['Всего']=got.Григорьев+got.Порфирьев;
  for(const nm in C){const left=due[nm]-got[nm],
    s=!got[nm]?['Не оплачено','']:left?['Частично','part']:['Всё оплачено','ok'];
    C[nm].st.textContent=s[0]; C[nm].st.className='st '+s[1];
    C[nm].s[0].textContent=f(due[nm]); C[nm].s[1].textContent=f(got[nm]); C[nm].s[2].textContent=f(left);}
}
upd();

/* ---- Живая камера: встроенный BarcodeDetector, запасной jsQR ---- */
const ov=document.getElementById('ov'), vid=document.getElementById('vid'), msg=document.getElementById('msg'), stat=document.getElementById('stat'), zoomEl=document.getElementById('zoom'), snapEl=document.getElementById('snap');
let statBase='', ic=null, seenInfo='';
const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
let det, stream, target, timer, t0=0, tick=0;
// Платёжный QR (ГОСТ Р 56042): ST00011|...|Sum=238373|... — сумма в копейках
function parseSum(t){
  const m=t.match(/(?:^|[|;&?])\s*(?:Sum|Summ|Summa|Amount|Сумма)\s*=\s*([\d.,]+)/i); if(!m)return null;
  const s=m[1]; return /[.,]/.test(s)?Math.round(parseFloat(s.replace(',','.'))*100):parseInt(s,10);
}
function got(text){
  const k=parseSum(text); if(k==null){msg.textContent='В QR нет суммы: '+text.slice(0,100);return false}
  v[target]=k; R[target].inp.value=(k/100).toFixed(2).replace('.',','); upd(); stop(); return true;
}
function stop(){clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null;ov.hidden=true;zoomEl.hidden=true;snapEl.hidden=true;ic=null}
// из найденных кодов берём тот, где есть Sum=; если формат не QR — помечаем его
// zxing-wasm (ядро zxing-cpp): читает плотные QR с экрана и cp1251 надёжнее jsQR; берём сырые байты
async function zread(img){
  if(typeof ZXingWASM==='undefined')return null;
  try{const r=await ZXingWASM.readBarcodes(img,{formats:['QRCode'],maxNumberOfSymbols:1,tryHarder:true});
    if(r.length){const b=r[0].bytes;return b&&b.length?String.fromCharCode.apply(null,Array.from(b)):r[0].text}}catch(e){}
  return null}
// Встроенный сканер код видит, но текст в старой кодировке (cp1251, ST00011) отдаёт пустым или кракозябрами:
// вырезаем область кода и читаем сырые байты через jsQR
function cropRead(src,sw,sh,bb){
  if(typeof jsQR!=='function'||!bb)return null;
  const mx=bb.width*.15,my=bb.height*.15,x=Math.max(0,bb.x-mx),y=Math.max(0,bb.y-my),w=Math.min(sw-x,bb.width+2*mx),h=Math.min(sh-y,bb.height+2*my);
  for(const m of [900,1200,700]){
    const s=m/Math.max(w,h),iw=Math.round(w*s),ih=Math.round(h*s),pd=Math.round(Math.max(iw,ih)*0.08);
    cv.width=iw+2*pd;cv.height=ih+2*pd;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(src,x,y,w,h,pd,pd,iw,ih);
    const d=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
    if(q)return String.fromCharCode.apply(null,q.binaryData)||q.data;
  }
  return null;
}
function pick(r){const b=r.find(x=>/sum\s*=/i.test(x.rawValue))||r[0];return b.format&&b.format!=='qr_code'?'['+b.format+'] '+b.rawValue:b.rawValue}
async function decode(){
  if('BarcodeDetector' in window){try{det=det||new BarcodeDetector();const r=await det.detect(vid);if(r.length){const t=pick(r);seenInfo=' · найдено: '+r.length+(t?'':' (текст пуст)');
      if(t&&/sum\s*=/i.test(t))return t;
      const c=cropRead(vid,vid.videoWidth,vid.videoHeight,(r.find(x=>!/sum\s*=/i.test(x.rawValue||''))||r[0]).boundingBox);
      if(c)return c; if(t)return t}}catch(e){}}
  const w=vid.videoWidth,h=vid.videoHeight; if(!w)return null;
  const V=[[.91,0],[.68,0],[.91,.8],[.68,.8],[.91,1.2],[.68,1.2]][tick++%6]; // на каждом новом кадре — следующий вариант: масштаб × сглаживание (гасит «сетку» монитора)
  for(const m of [V[0]]){ // белое поле вокруг кадра (тихая зона QR)
    const s=m,iw=Math.round(w*s),ih=Math.round(h*s),pd=Math.round(Math.max(iw,ih)*0.08);
    cv.width=iw+2*pd;cv.height=ih+2*pd;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.filter=V[1]?'blur('+V[1]+'px)':'none';cx.drawImage(vid,pd,pd,iw,ih);cx.filter='none';
    const z=await zread(cx.getImageData(0,0,cv.width,cv.height)); if(z)return z;
    if(typeof jsQR==='function'){
      const d=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
      // binaryData: полный текст, в т.ч. для кодировки cp1251 (q.data для неё пустой)
      if(q)return String.fromCharCode.apply(null,q.binaryData)||q.data;
    }
  }
  return null;
}
function loop(){timer=setTimeout(async()=>{
  try{seenInfo='';const t1=performance.now(),t=await decode();stat.textContent=statBase+seenInfo+' · '+Math.round(performance.now()-t1)+' мс/кадр';if(t&&got(t))return}catch(e){}
  if(stream){if(Date.now()-t0>6000&&msg.textContent.indexOf('Наведите')===0)msg.textContent='Не читается? Держите телефон ровно, в 20 см от QR, без бликов; QR должен быть чётким.';loop()}},40)}
async function scan(k){
  target=k; t0=Date.now(); ov.hidden=false; msg.textContent='Запускаю камеру…';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'камера недоступна на этой странице'};
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    vid.srcObject=stream; await vid.play(); msg.textContent='Наведите камеру на QR платёжки';
    const tr=stream.getVideoTracks()[0], cap=tr.getCapabilities?tr.getCapabilities():{}, st=tr.getSettings?tr.getSettings():{};
    statBase=vid.videoWidth+'×'+vid.videoHeight+' · встроенный сканер: '+(('BarcodeDetector' in window)?'да':'нет')+' · zxing: '+((typeof ZXingWASM!=='undefined')?'да':'нет');
    stat.textContent=statBase;
    if(cap.zoom){zoomEl.min=cap.zoom.min;zoomEl.max=cap.zoom.max;zoomEl.step=cap.zoom.step||0.1;zoomEl.value=st.zoom||cap.zoom.min;zoomEl.hidden=false;
      zoomEl.oninput=()=>tr.applyConstraints({advanced:[{zoom:+zoomEl.value}]}).catch(()=>{})}
    if('ImageCapture' in window){ic=new ImageCapture(tr);snapEl.hidden=false;snapEl.onclick=shot}
    loop();
  }catch(e){msg.textContent='Нет доступа к камере ('+(e.name||'ошибка')+'). Разрешите камеру в браузере.'}
}
// Снимок в максимальном разрешении камеры (намного чётче видео 1920×1080) — для упрямых кодов
async function shot(){
  if(!ic)return; msg.textContent='Снимаю в высоком разрешении…';
  try{
    let opt={};try{const c=await ic.getPhotoCapabilities();if(c.imageWidth&&c.imageHeight)opt={imageWidth:c.imageWidth.max,imageHeight:c.imageHeight.max}}catch(e){}
    const bm=await createImageBitmap(await ic.takePhoto(opt)); let t=null, nf='—';
    if('BarcodeDetector' in window){try{det=det||new BarcodeDetector();const r=await det.detect(bm);nf=r.length;if(r.length){t=pick(r);if(!(t&&/sum\s*=/i.test(t))){const c=cropRead(bm,bm.width,bm.height,r[0].boundingBox);if(c)t=c}}}catch(e){nf='ошибка '+(e.name||'')}}
    if(!t){for(const m of [2600,1800]){const s=Math.min(1,m/Math.max(bm.width,bm.height)),iw=Math.round(bm.width*s),ih=Math.round(bm.height*s),pd=Math.round(Math.max(iw,ih)*0.08);
      cv.width=iw+2*pd;cv.height=ih+2*pd;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bm,pd,pd,iw,ih);
      const z=await zread(cx.getImageData(0,0,cv.width,cv.height));if(z){t=z;break}}}
    if(!t&&typeof jsQR==='function'){for(const [m,bl] of [[2600,0],[1800,0],[2600,1],[1800,1],[2600,2],[1800,2]]){
      const s=Math.min(1,m/Math.max(bm.width,bm.height)),iw=Math.round(bm.width*s),ih=Math.round(bm.height*s),pd=Math.round(Math.max(iw,ih)*0.08);
      cv.width=iw+2*pd;cv.height=ih+2*pd;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.filter=bl?'blur('+bl+'px)':'none';cx.drawImage(bm,pd,pd,iw,ih);cx.filter='none';
      const d=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
      if(q){t=String.fromCharCode.apply(null,q.binaryData)||q.data;break}}}
    if(!t)msg.textContent='На снимке код не найден ('+bm.width+'×'+bm.height+', сканер нашёл: '+nf+'). Приблизьте ползунком и повторите.'; else got(t);
  }catch(e){msg.textContent='Снимок не удался ('+(e.name||'ошибка')+').'}
}
document.getElementById('close').onclick=stop;
</script>
</body>
</html>
